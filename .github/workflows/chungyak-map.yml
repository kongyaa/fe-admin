name: chungyak-map

on:
  schedule:
    # 매주 화요일 06:00 KST (월요일 21:00 UTC)
    - cron: '0 21 * * 1'
  workflow_dispatch:
  # main에 합쳐지면 바로 다시 배포한다(데이터·화면 수정이 다음 예약 실행까지 기다리지 않게)
  push:
    branches: [main]
    paths:
      - 'scripts/chungyak-alert/**'
      - '.github/workflows/chungyak-map.yml'
  pull_request:
    paths:
      - 'scripts/chungyak-alert/**'
      - '.github/workflows/chungyak-map.yml'

permissions:
  contents: read

# PR은 브랜치마다 따로 돌고 새 커밋이 오면 이전 실행을 취소한다. main 배포는 하나씩 끝까지 돈다.
concurrency:
  group: chungyak-map-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/chungyak-alert
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 서울 자료가 실패하면 여기서 멈추고 이전 배포가 유지된다. 공고 연결·관련 소식은 실패해도 계속한다.
      # 네이버 키가 없으면 관련 소식만 건너뛴다(skipped=no_key). 뉴스 단계는 3분 시간 한도가 있어 작업 시간을 넘기지 않는다.
      # NAVER_NEWS_ENDPOINT는 비밀이 아닌 설정이라 저장소 Variables에서 읽는다(선택, hub 기본 또는 legacy).
      # PR 실행에서도 뉴스를 켠다: 실행당 약 120건으로 하루 한도 25,000건에 비해 작고, 실제 자료로 확인할 수 있다.
      - name: Build projects.json
        run: node src/pipeline/build-map.js --out site/projects.json
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_NEWS_ENDPOINT: ${{ vars.NAVER_NEWS_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/chungyak-alert/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
