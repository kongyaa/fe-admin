name: chungyak-map

on:
  schedule:
    # 하루 두 번: 07:00 KST(전날 22:00 UTC), 19:00 KST(10:00 UTC). 새 소식·접수 일정을 아침저녁으로 새로 모은다.
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
  # main에 합쳐지면 바로 다시 배포한다(데이터·화면 수정이 다음 예약 실행까지 기다리지 않게)
  push:
    branches: [main]
    paths:
      - 'scripts/chungyak-alert/**'
      - '.github/workflows/chungyak-map.yml'
  pull_request:
    paths:
      - 'scripts/chungyak-alert/**'
      - '.github/workflows/chungyak-map.yml'

permissions:
  contents: read

# PR은 브랜치마다 따로 돌고 새 커밋이 오면 이전 실행을 취소한다. main 배포는 하나씩 끝까지 돈다.
concurrency:
  group: chungyak-map-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/chungyak-alert
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 서울 자료가 실패하면 여기서 멈추고 이전 배포가 유지된다. 공고 연결은 실패해도 계속한다.
      # 단계 변경(changes)은 지금 배포된 projects.json과 비교한다(MAP_PREVIOUS_URL로 바꿀 수 있음). 못 받으면 건너뛴다.
      - name: Build projects.json
        run: node src/pipeline/build-map.js --out site/projects.json
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/chungyak-alert/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
