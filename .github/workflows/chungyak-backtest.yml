name: chungyak-backtest

# 일회성 백테스트(버리는 브랜치). 보내거나 저장하는 것이 없다. 프로필, Notion, 카카오, Gmail 비밀값은 넘기지 않는다.
on:
  # 기본 브랜치에 없는 워크플로는 dispatch할 수 없어, 이 브랜치에 push하면 backtest-runs.txt의 줄마다 돌린다.
  push:
    branches: [backtest/lotto-criteria-check]
    paths: [scripts/chungyak-alert/backtest-runs.txt, scripts/chungyak-alert/backtest.js]
  workflow_dispatch:
    inputs:
      asOf:
        description: 기준일 YYYY-MM-DD (배치의 today)
        required: true
        type: string
      nameContains:
        description: 공고명에 들어 있는 글자
        required: true
        type: string
      lookbackDays:
        description: 수집 기간(일). 비우면 config 기본값
        required: false
        type: string
      listOnly:
        description: 목록만 출력(판별 안 함)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  TZ: Asia/Seoul

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/chungyak-alert
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Backtest (push, backtest-runs.txt)
        if: github.event_name == 'push'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          # 줄 형식: asOf|공고명 일부|수집 기간(일, 비우면 기본)|목록만(1)
          grep -v '^#' backtest-runs.txt | grep -v '^$' | while IFS='|' read -r asof name lookback listonly; do
            echo "##### asOf=$asof name=$name lookback=$lookback listOnly=$listonly"
            BACKTEST_AS_OF="$asof" BACKTEST_NAME="$name" BACKTEST_LOOKBACK="$lookback" BACKTEST_LIST_ONLY="${listonly:-0}" node backtest.js || echo "exit=$?"
          done

      - name: Backtest (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: node backtest.js
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BACKTEST_AS_OF: ${{ inputs.asOf }}
          BACKTEST_NAME: ${{ inputs.nameContains }}
          BACKTEST_LOOKBACK: ${{ inputs.lookbackDays }}
          BACKTEST_LIST_ONLY: ${{ inputs.listOnly && '1' || '0' }}
