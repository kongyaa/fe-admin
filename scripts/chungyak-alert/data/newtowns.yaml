  - id: guri-topyeong-hangang
    name: 구리토평한강
    region: 경기
    district: 구리
    kind: 공공주택지구
    stage: 지구지정
    stageDates:
      후보지: "2023-11-15"
      지구지정: "2025-12-31"
    households: 22000
    noticeMatch: [토평한강, 토평2]
    notes: >-
      구리토평2 공공주택지구. '구리토평한강'은 구리시 명칭 공모(2025-06-02~27, 689건) 1위작으로 국토부에 공식 명칭으로 건의할 예정이라는
      헤럴드경제 2025-08-04 기사 기준이며, 국토부 지정 보도와 구리시 누리집(2026-10-30 수정)은 여전히 '구리토평2'로 적는다(공식 채택 미확인).
      후보지(2023-11-15)와 지구지정(2025-12-31)은 구리시 누리집 추진 현황 및 SBS Biz 2025-12-31 기사.
      가구 수 22,000은 한국경제 2025-12-31 기사('구리토평2지구(2만2000가구)'). 다른 보도는 '잠정'으로 적는다.
      향후 일정(보도 기준): 지구계획 최초 승인 2027년 예정(SBS Biz 2025-12-31), 2026 지구계획 승인 신청 → 2027 승인 → 2029 조성공사 착수
      → 2034 준공 목표(헤럴드경제 2026-01-26). 분양 시기는 보도된 계획이 없어 expected는 넣지 않는다.
      noticeMatch: 구리 토평동에는 기존 아파트가 많아 '토평' 단독은 쓰지 않고 '토평한강'·'토평2'로 한정한다.
    sources:
