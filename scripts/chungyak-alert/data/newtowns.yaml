    # 분양 이력·다음 블록 계획 (2026-11-10 조사). 본청약은 A2 하나뿐이고, 2026-11-10까지 다른 블록 공고는 찾지 못했다
    # (LH 청약플러스 목록은 직접 조회하지 못해 웹·기사 검색 기준). 사전청약은 stage: 사전청약으로 적는다.
    # A2 본청약 1,115가구 중 866가구가 사전청약 당첨자 몫이라는 수치는 뉴시스 2025-03-31 NISX20250331_0003120514('3기 신도시' 하남교산
    # 내달 첫 본청약)·스마트투데이 2025-04-24 기준. 같은 날 뉴시스 NISX20250331_0003120384(LH, 하남교산 첫 공공분양주택)에는 866이 없다
