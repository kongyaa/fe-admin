towns:
  - id: hanam-gyosan
    name: 하남교산
    region: 경기
    district: 하남
    kind: 공공주택지구
    # 2025-03 A2블록(교산 푸르지오 더 퍼스트) 본청약 공고가 나왔으므로 블록별 분양 단계
    stage: 블록별 분양
    stageDates:
      후보지: "2018-12"
      지구지정: "2019-10-15"
      지구계획승인: "2021-08"
      블록별 분양: "2025-03-31"
    households: 36697
    noticeMatch: [교산]
    notes: >-
      3기 신도시. 후보지(2018-12, 수도권 30만호 2차 발표)와 지구지정(2019-10-15자 고시)은 뉴시스 2019-10-13 기사
      ("15일자로 공공주택지구 지정을 고시한다고 13일 밝혔다").
      지구계획승인(2021-08)은 머니투데이방송 2021-08-26 기사(국토부가 26일 승인 발표).
      블록별 분양(2025-03-31)은 뉴시스 2025-03-31 기사: LH가 A2블록 '교산 푸르지오 더 퍼스트'(1,115가구) 입주자 모집공고를
      31일 게시, 사전청약 당첨자 본청약 4/29~30, 특별공급 5/7, 일반공급 5/8~9(스마트투데이 2025-04-24 기사도 같은 일정).
      가구 수 36,697은 경인일보 2024-12-22 기사의 지구계획 변경(3차) 수치(33,037 → 36,697). 이후 4차(2025-12-18)·5차(2026-10-08)
      변경 고시가 있다는 검색 결과가 있으나 변경 후 가구 수는 확인하지 못해 3차 기준으로 둔다. 2021·2025 기사에는 '약 3만3000가구'로 나온다.
      부지조성 착공 시점은 확인하지 못해 비워 둔다. noticeMatch '교산'은 블록 공고명(예: 교산 푸르지오 더 퍼스트)과
      지구 주소(천현동·교산동·춘궁동 일원)에 쓰이는 이름이다.
    sources:
