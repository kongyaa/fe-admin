    # 구 이름 그대로(계양구). '계양'으로 쓰면 townDistrict가 '계양시'로 바꿔 공고 주소와 안 맞는다.
    # 청약홈 공고 주소는 '인천광역시 계양구 …'라 cityStem('계양구')가 들어 있다.
    district: 계양구
    kind: 공공주택지구
    # 2024-09-20 A3블록 신혼희망타운 본청약 공고(3기 신도시 첫 본청약)로 블록별 분양 단계
    stage: 블록별 분양
    stageDates:
      후보지: "2018-12-19"
      지구지정: "2019-10-15"
      지구계획승인: "2021-06-02"
      부지조성 착공: "2022-11-15"
      블록별 분양: "2024-09-20"
    households: 17980
    noticeMatch: [인천계양, 계양신도시]
    notes: >-
      3기 신도시(공식 명칭 인천계양 테크노밸리 공공주택지구). 후보지(2018-12-19, 2차 발표)와 지구지정(2019-10-15자 고시)은
      뉴시스 2019-10-13 기사("15일자로 공공주택지구 지정을 고시", "지난해 12월19일 2차로 발표", 인천 계양 335만㎡·1만7000호).
      지구계획승인은 뉴시스 2021-06-02 기사(국토부가 2일 3기 신도시 최초로 승인, 1만7000가구·333만㎡, 공공임대 6066·공공분양 2815).
      고시일이 6월 3일이라는 검색 결과(smartcity.go.kr 보도자료 재게시)가 있으나 원문은 확인하지 못해 발표일로 둔다.
      부지조성 착공(2022-11-15)은 머니투데이방송 2022-11-14 기사('오는 15일 … 조성공사 착공식', 계양구 동양동 일원).
      머니투데이방송 2024-03-28은 '2022년 11월 지구 조성사업에 착수', 위치 계양구 귤현동·동양동·박촌동 일원으로 적는다.
      블록별 분양(2024-09-20)은 비즈워치 2024-09-20 기사('LH는 20일 인천계양 A3블록 신혼희망타운(공공분양) 입주자모집공고').
      가구 수 17,980은 국토교통부 고시 제2025-937호(2025-12-30, 지구지정 변경(4차)·지구계획 변경(3차)) 원문 수치:
      주택 17,076세대(단독 170, 공동 16,906) → 17,980세대(단독 204, 공동 17,776), 904세대 증가, 계획인구 41,666 → 43,869명,
      면적 3,333,409㎡ → 3,350,904㎡(서울 강서구 오곡동·계양구 박촌동 편입). 이후 지구계획 변경(4차)이 2026-09-09 고시(제2026-473호)됐으나
      변경 후 가구 수는 확인하지 못해 3차 기준으로 둔다. 경인일보 2026-03-03(지역지)은 '계양지구 전체 1만 8,000가구'로 적는다.
      청약홈 LH 공고 주소는 '계양구 귤현동, 동양동, 박촌동, 병방동, 상야동, 경기도 부천시 대장동, 서울특별시 강서구 오곡동 일원'.
      A2·A3블록(1,285가구) 첫 입주 2026-12 예정(데일리안 2026-07-28, 파이낸셜뉴스 2026-10-05).
      noticeMatch: '계양' 단독은 계양구의 다른 단지까지 잡으므로 '인천계양'(LH 공고명 '인천계양 A9블록…', '인천계양지구 A6블록…'과
      청약홈 주소 '인천계양 테크노밸리 공공주택지구')과 '계양신도시'(민간 단지명 '계양신도시 카이브 유보라')로 한정한다.
      '인천계양'이 지구 밖의 옛 LH 계양구 단지 공고명에도 쓰이는지는 확인하지 못했다.
