        url: https://news.mtn.co.kr/article/2021082609362623524
        date: "2021-08-26"
      - title: "하남교산 소형 비중 높여 3360가구 늘린다 (경인일보)"
        url: https://www.kyeongin.com/article/1723580
        date: "2024-12-22"
      - title: "'3기 신도시' 하남교산 내달 첫 본청약…분양가 17% 올라 (뉴시스)"
        url: https://www.newsis.com/view/NISX20250331_0003120514
