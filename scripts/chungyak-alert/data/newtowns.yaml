    stage: 블록별 분양
    stageDates:
      후보지: "2019-05"
      지구지정: "2020-05-27"
      지구계획승인: "2021-11-30"
      부지조성 착공: "2023-05-17"
      블록별 분양: "2025-04-30"
    households: 20318
    noticeMatch: [부천대장]
    notes: >-
      3기 신도시. 위치는 부천시 오정구 대장동·오정동·원종동·삼정동 일원에 인천 계양구 동양동·박촌동·병방동 일부가 들어간다(LH 3기신도시 누리집).
      사업시행자는 경기도·LH·부천도시공사. 후보지(2019-05)는 부천시 누리집 추진실적('수도권 3기 신도시, 부천 대장지구 선정').
      지구지정(2020-05-27 고시)은 LH 3기신도시 누리집 추진경위와 국토교통부고시 제2021-1284호 본문('2020-400(2020.05.27.)')으로 확인.
      국토부 발표는 2020-05-25(이투데이·머니투데이방송, 당시 '2만호').
      지구계획승인(2021-11-30)은 국토교통부고시 제2021-1284호(지구지정 변경(1차) 및 지구계획 승인, 고시일 2021-11-30)와 이투데이 2021-11-30 기사(1만9,500가구, 342만㎡).
      지구계획 변경: 1차 2022-11-07(고시 제2022-630호, 19,500호 → 19,066호), 2차 2023-11-24(고시 제2023-659호), 3차 2024-09-12(고시 제2024-459호,
      19,355호 → 19,046호, 인구 44,518 → 43,806명), 4차 2025-11-24(LH 3기신도시 누리집, 고시 원문은 확인 못 함).
      가구 수 20,318은 부천시 누리집 사업개요(2025-12-29 수정, 4차 변경 뒤)의 '20,318세대'이고, 확인한 마지막 고시 원문은 3차 19,046호다. LH 누리집은 '주택 20천 호'로 적는다.
      부지조성 착공은 출처마다 다르다: LH 3기신도시 누리집 '2023. 05. 17. 조성공사 착공', 부천시 누리집 '2023. 7. 조성공사 착공',
      부천도시공사 추진일정(안, 2023-12-20 게시) '2023.6 조성공사 착공'. 시행자인 LH 누리집 날짜를 따른다.
      첫 공동주택 착공은 2024-12(SBS Biz 2026-09-22, A5~A8 4개 블록 2,505가구는 이투데이 2024-09-09 계획 보도).
      블록별 분양(2025-04-30)은 청약홈 A-5BL·A-6BL 신혼희망타운 모집공고일과 아시아경제 2025-04-30(A7·A8 본청약 시작).
      첫 입주 2027-11 예정(부천시 누리집, SBS Biz 2026-09-22 'A5·A6블록 1천600가구 내년 11월').
      noticeMatch: 청약홈 공고명·주소가 'e편한세상 대장 퍼스티움(부천대장 A-5BL)', '부천대장 택지개발사업지구 내 A-5블록', '부천대장 하우스토리 디센트' 꼴이라
      '부천대장'만 쓴다. '대장' 단독은 성남 대장지구 등과 겹치고, '부천'은 부천역곡·부천원종 공고까지 잡고,
      '하우스토리'는 부천역곡 A-2BL '역곡지구 하우스토리'(파이낸셜뉴스 2026-07-09)와 겹쳐 쓰지 않는다.
