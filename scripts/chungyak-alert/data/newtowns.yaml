    # 2025-07-24 A-1·A-2블록 본청약 공고가 나와 블록별 분양 단계
    stage: 블록별 분양
    stageDates:
      후보지: "2018-12-19"
      지구지정: "2019-10-15"
      지구계획승인: "2021-08-31"
      부지조성 착공: "2023-10-15"
      블록별 분양: "2025-07-24"
    households: 60394
    noticeMatch: [왕숙A, 왕숙B, 왕숙S, 왕숙지구, 왕숙공공주택지구, 왕숙푸르지오, 왕숙한신더휴]
    notes: >-
      3기 신도시. 남양주왕숙2(namyangju-wangsuk2)와 따로 지정된 별개 지구다. 후보지(2018-12-19 수도권 30만호 2차 발표)와 지구지정(2019-10-15자 고시)은
      뉴시스 2019-10-13 기사, 지정 고시일은 3기 신도시 누리집 고시 목록(2019-10-15 '남양주왕숙 공공주택지구의 지정 및 지형도면 등의 고시')으로도 확인.
      지구계획승인(2021-08-31)은 3기 신도시 누리집의 국토교통부고시 제2021-1039호(지정변경 1차 및 지구계획 승인). 국토부 발표는 2021-08-26(머니투데이방송).
      부지조성 착공(2023-10-15)은 서울신문 2023-10-15 기사: 왕숙·왕숙2 착공식을 15일 진건읍 사능양묘장 일대에서 열었다.
      블록별 분양(2025-07-24)은 LH청약플러스 A-1블록 공공분양 입주자모집공고일(아래 history).
      가구 수 60,394는 서울경제 2024-12-03 기사의 지구계획 변경(3차) 수치(당초 52,380 → 60,394). 3기 신도시 누리집은 이 3차 변경(국토부고시 제2024-678호)을
      2024-12-09에 게시했고 서울경제는 '3일 고시'로 적어 날짜가 엇갈린다. 이후 4차 변경(국토부고시 제2025-940호, 누리집 게시 2026-01-05)은
      한국경제 2026-01-19 기사에 '진건지구 편입으로 기존(6만394가구)보다 3765가구 늘어난다'고만 나오고 변경 후 합계는 기사에 없어 3차 기준으로 둔다.
      2021-08 지구계획 승인 때는 약 5만4000가구(머니투데이방송 2021-08-26)였다.
      noticeMatch: '왕숙' 단독은 남양주왕숙2 공고(남양주왕숙2 A-3BL, 왕숙 아테라)까지 잡아 쓰지 않는다. LH 공고명은 '남양주왕숙 A-24블록'·'남양주왕숙지구 A-1블록'
      꼴이라(공백 제거 뒤 '왕숙A'·'왕숙B'·'왕숙지구') 왕숙2('왕숙2A'·'왕숙2지구')와 갈린다. 주소 '남양주왕숙 공공주택지구'는 '왕숙공공주택지구'로 잡는다.
      청약홈 민간참여 단지는 주소가 '진접읍 연평리 일원'처럼 지구 이름이 없어 단지 이름('왕숙푸르지오', '왕숙한신더휴')을 따로 넣었다.
      앞으로 나올 다른 이름의 민간참여·민간분양 단지는 이 목록으로 잡히지 않으니 공고가 나면 이름을 더한다.
