  - id: guri-galmae-station
    name: 구리갈매역세권
    region: 경기
    district: 구리
    kind: 공공주택지구
    stage: 블록별 분양
    stageDates:
      지구지정: "2018-07-04"
      지구계획승인: "2019-12-31"
      부지조성 착공: "2022-12-29"
      블록별 분양: "2025-08"
    households: 6162
    noticeMatch: [갈매역세권]
    notes: >-
      지구지정(2018-07-04)·지구계획승인(2019-12-31)·조성공사 착공(2022-12-29)은 구리시 누리집 '갈매역세권 공공주택지구' 추진 현황
      (일부 언론 보도는 지정을 2017년 7월로 적어 엇갈리나 구리시 공식 자료를 따른다). 같은 자료에 2025-12-29 A-4BL 본청약도 있다.
      블록별 분양(2025-08)은 한국경제 2025-08-05 기사: LH가 A1블록 신혼희망타운 1,182가구 공급 발표(5일), 사전청약 당첨자 11~12일·일반 13~14일 접수.
      확인된 가장 이른 본청약이며, 그 전에 다른 블록 본청약이 있었는지는 확인하지 못했다.
      최근 공고: A-1블록 행복주택 609가구 모집공고 2026-10-27(메트로신문 2026-10-27),
      B-1블록 '구리갈매역세권 신안인스빌 디센트' 213세대, 특별공급 2026-11-09·1순위 11-10·2순위 11-11, 당첨자 발표 11-17(메트로신문 2026-11-03,
      파이낸셜뉴스 2026-10-05는 B-1블록·213가구·분양가상한제 적용 확인).
      가구 수 6,162(면적 798,103㎡, 계획인구 15,676명)는 메트로신문 2026-11-03 기사.
      noticeMatch: 바로 옆에 별개의 구리갈매 공공주택지구(갈매지구)가 있어(파이낸셜뉴스 2026-10-05: 별내신도시와 구리갈매지구 사이)
      '갈매' 단독은 그 지구 공고까지 잡으므로 '갈매역세권'만 쓴다. 블록 공고명은 '구리갈매역세권 A-1블록', '구리갈매역세권 신안인스빌 디센트' 꼴.
    sources:
