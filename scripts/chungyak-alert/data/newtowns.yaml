      3기 신도시. 후보지(2019-05-07)는 국토부 3차 신규택지 발표(머니투데이 2019-05-07, 3만8000가구·813만㎡).
      지구지정(2020-03-06, 국토부 고시 제2020-245호)과 지구계획승인(2021-11-30, 지정변경(2차) 및 지구계획 승인 고시 제2021-1285호)은
      LH 3기 신도시 누리집 '고양 창릉' 주요 추진경위(MTN 2020-03-04 '오는 6일 지정 고시', 이투데이 2021-11-30 '30일 밝혔다'도 같은 날짜).
      부지조성 착공 '2023-06'은 LH 누리집 표기(일 없음). 언론은 2023년 5월로 적는다(이투데이 2026-10-13 '2023년 5월 조성공사 착수',
      고양신문(지역지) 2024-05-03 '1공구 토목 공사 2023-05-30 시작'). LH 공식 자료를 따른다.
      이후 지구계획 변경: 1차 2022-11-02, 3차 2024-10-18(고시 제2024-540호), 4차 2025-12-24(LH 누리집. 경기일보 2025-12-26은
      4차 변경으로 공업지역 15만5182㎡ 지정). 2차 변경 날짜와 각 변경의 가구 수는 확인하지 못했다.
      가구 수 38,334(공동주택 37,188 + 단독 1,146, 811만㎡)는 고양신문(지역지) 2026-04-29, 더리포트 2026-09-28도 3만8334세대·계획인구 9만1998명.
      어느 변경 고시의 수치인지는 확인하지 못했다. LH 누리집·국토부·전국지는 '약 3만8000'(2021 지구계획 승인 38,000), MTN 2022-05-19는 37,889.
      블록별 분양(2025-01-31): LH가 A4·S5·S6 1,792가구 본청약을 31일부터 받는다고 발표(한국경제 2025-01-31).
      사업시행자: 경기도, LH, 경기주택도시공사, 고양도시관리공사(LH 누리집). 사업 준공 예정 2029-12(LH 누리집).
      첫마을(A4·S5·S6, 행복주택 포함 2,089세대) 주택공사는 2024-10 착공, 2027-12 첫 입주 목표(이투데이 2026-10-13).
      noticeMatch '창릉': 블록 공고명이 '고양창릉 S-3블록', '고양 창릉 우미린 그레니티'처럼 '창릉'을 쓴다. 지구 주소는 덕양구 원흥동·도내동·용두동·동산동 등
      법정동이라 '창릉'이 없을 수 있다. 고양시에 '창릉동'(행정동)과 '창릉천'이 있어 지구 밖 공고가 걸릴 수 있으나, 지구 밖 '창릉' 이름 단지는 찾지 못했다.
