  - id: gwangmyeong-siheung
    name: 광명시흥
    region: 경기
    # 지구가 광명시와 시흥시에 걸쳐 있다. district는 한 시만 받으므로 면적·사업본부 기준 대표인 광명으로 둔다(notes 참고).
    district: 광명
    kind: 공공주택지구
    # 2024-12-30 지구계획 승인. 2026-07 협의보상 착수, 부지조성 착공은 2027년 말 목표라 아직 지구계획승인 단계
    stage: 지구계획승인
    stageDates:
      후보지: "2021-02-24"
      지구지정: "2022-11-29"
      지구계획승인: "2024-12-30"
    households: 67000
    noticeMatch: [광명시흥]
    expected:
      from: "2029-01"
      to: "2029-12"
      basis: "국토부 지구계획 승인 발표(2024-12-30)와 디지털타임스 2026-05-24 보도: 2029년 첫 분양 목표(2027년 말 택지 착공, 2031년 최초 입주)"
    notes: >-
      3기 신도시. 2021-02-24 국토부가 2·4대책 후속 신규 공공택지 1차로 발표했고 6번째 3기 신도시로 추가됐다(뉴시스 2021-02-24, 1,271만㎡·7만 가구).
      지구지정은 2022-11-29 고시(머니투데이방송 2022-11-28 '29일 지정·고시', SBS Biz 2022-11-28). 위치는 광명시 광명동·옥길동·노온사동·가학동,
      시흥시 과림동·무지내동·금이동 일원(머니투데이방송 2022-11-28). 2010년 보금자리주택지구로 지정됐다가 2015년 해제된 땅이다.
      지구계획 승인 2024-12-30: 경기일보 2025-01-09 '지난해 12월30일 국토교통부가 지구계획을 승인', 서울경제 2024-12-30 '승인했다고 30일 밝혔다',
      광명시 보도자료 2024-12-31도 같은 날로 적는다. 가구 수 67,000은 이 지구계획 승인 수치(공공주택 3만7천: 공공분양 1만3천·공공임대 2만4천, 서울경제 2024-12-30).
      이후 지구계획 변경으로 가구 수가 바뀌었다는 보도·고시는 찾지 못했다. 시행자는 LH·GH(광명시 보도자료 2024-12-31).
      사전청약: 2021년 발표 때는 2023년 사전청약·2025년 분양 시작 계획이었으나(뉴시스 2021-02-24) 진행되지 않았다
      (아주경제 2025-01 '지난해 정부가 사전청약제도를 폐지하면서 진행되지 않았다').
      일정 목표: 2025년 보상 공고 → 2027년 택지 착공 → 2029년 첫 분양 → 2031년 최초 입주(국토부 발표, 서울경제 2024-12-30).
      광명시 보도자료(2024-12-31)는 2031년을 '준공'으로 적어 국토부(최초 입주)와 다르다. 보상은 감정평가 2026-05-19 마무리(디지털타임스 2026-05-24),
      LH가 2026-07-09 협의보상 안내문 발송, 2026-07-31부터 연말까지 협의(당초 11월에서 앞당김, 파이낸셜뉴스·뉴시스 2026-07-14), 착공 목표 2027년 말.
      noticeMatch '광명시흥'은 블록 공고명(예: 광명시흥 S1-10BL)에 쓰일 지구 이름이다. '광명'·'시흥'·'옥길' 단독은 기존 단지·다른 지구(광명학온, 시흥목감 등)와 겹쳐 쓰지 않는다.
      주의: GH의 '광명시흥 도시첨단산업단지'(광명시흥테크노밸리) 통합공공임대 공고도 '광명시흥'을 포함할 수 있다.
